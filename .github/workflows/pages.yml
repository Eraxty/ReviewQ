name: Update queue

# Pages only serves static files, so this crawls the Pixl API on a schedule,
# writes queue.json next to the site and deploys both. The crawler's database
# (probe schedule and first-seen ship times) lives on the `state` branch
# between runs.
#
# GitHub's scheduler is best effort and in practice fires this every 4-6
# hours, so each run queues the next one itself (the `next` job). The cron
# stays as a fallback that restarts the chain if a run ever fails to queue.

on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # push the state branch
  pages: write
  id-token: write
  actions: write # queue the next run

# Never two crawls at once: they would double the request rate and race on
# the state branch.
concurrency:
  group: update-queue
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy-retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Restore crawl state
        run: |
          mkdir -p data
          if git fetch --depth=1 origin state; then
            git show FETCH_HEAD:pixl.db > data/pixl.db
          else
            echo "No state branch yet, starting a full crawl."
          fi

      - name: Crawl
        run: python crawler.py --budget 420

      - name: Save crawl state
        id: state
        run: |
          blob=$(git hash-object -w data/pixl.db)
          tree=$(printf '100644 blob %s\tpixl.db\n' "$blob" | git mktree)
          commit=$(git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit-tree "$tree" -m "Crawl state")
          # One commit, force-pushed, so the branch never grows.
          git push --force origin "$commit:refs/heads/state"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Build site
        run: python export.py _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # GitHub sometimes answers the deploy with a 502; one retry after a
      # short wait gets past it, and the next scheduled run covers the rest.
      # deploy-pages tags the build with GITHUB_SHA, and Pages quietly keeps
      # the live site when that version repeats, so every run between pushes
      # was a no-op. The state commit is new each run, so use that instead.
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true
        env:
          GITHUB_SHA: ${{ steps.state.outputs.commit }}

      - name: Wait before retrying the deploy
        if: steps.deploy.outcome == 'failure'
        run: sleep 30

      - id: deploy-retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
        env:
          GITHUB_SHA: ${{ steps.state.outputs.commit }}

  # A separate job so the Pages deploy above is finished and closed before
  # this waits. Runs even when the update failed, so one bad crawl doesn't
  # stop the chain. Waits until 10 minutes after the run started to keep the
  # same request rate as the schedule, and skips if a push or the cron
  # already has a run waiting, so the chain never forks.
  next:
    needs: update
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Queue the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at)
          wait=$(( $(date -d "$started" +%s) + 600 - $(date +%s) ))
          if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          waiting=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pages.yml \
            --limit 20 --json databaseId,status \
            --jq "[.[] | select(.status != \"completed\" and .databaseId != $GITHUB_RUN_ID)] | length")
          if [ "$waiting" -gt 0 ]; then
            echo "A run is already waiting, not queuing another."
          else
            gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
          fi
